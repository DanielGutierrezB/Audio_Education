name: Build macOS DMG

# Tag pushes (v0.3.0, v0.3.1, ...) build the unsigned arm64 zip+DMG and
# publish them — with electron-updater's latest-mac.yml metadata — to the
# PUBLIC releases-only repo (audiopro-releases), which is what the in-app
# ⟳ auto-updater reads (same architecture as the Sync app: private
# source, public artifacts). Requires the RELEASES_TOKEN secret: a PAT
# with Contents read/write on audiopro-releases. Manual runs
# (workflow_dispatch) build and upload the DMG as a workflow artifact
# only, for testing the packaging step without cutting a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    # macos-15 is the current arm64 image; macos-14 is deprecated and
    # AudioPro only targets Apple Silicon (see package.json build.mac.arch).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg/ffprobe/RNNoise model (arm64, SHA256-verified)
        run: npm run setup:bin

      - name: Build macOS arm64 zip + DMG (publish to audiopro-releases on tags)
        env:
          # electron-builder publishes to build.publish (audiopro-releases)
          # with this token; never to this (private) source repo.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            npm run build -- --publish always
          else
            npm run build -- --publish never
          fi

      - name: Locate DMG
        id: dmg
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "No DMG found under dist/" >&2
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg_path")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
