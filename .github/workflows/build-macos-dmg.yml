name: Build macOS DMG

# Tag pushes (v0.3.0, v0.3.1, ...) build the signed-free arm64 DMG and
# attach it to a GitHub Release with a stable download link. Manual runs
# (workflow_dispatch) build and upload the same DMG as a workflow
# artifact only, for testing the packaging step without cutting a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # macos-15 is the current arm64 image; macos-14 is deprecated and
    # AudioPro only targets Apple Silicon (see package.json build.mac.arch).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg/ffprobe/RNNoise model (arm64, SHA256-verified)
        run: npm run setup:bin

      - name: Build macOS arm64 DMG
        run: npm run build

      - name: Locate DMG
        id: dmg
        run: |
          set -euo pipefail
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "No DMG found under dist/" >&2
            exit 1
          fi
          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg_path")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with the DMG attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          notes="Unsigned macOS build (Apple Silicon / arm64) — first launch needs right-click → Open to bypass Gatekeeper (see README § Known limitations)."
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.dmg.outputs.path }}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "${{ steps.dmg.outputs.path }}" \
              --title "AudioPro $tag" \
              --notes "$notes" \
              --repo "${{ github.repository }}"
          fi
