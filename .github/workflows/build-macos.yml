name: Build macOS Installer

# Tag pushes (v0.6.1, v0.6.2, ...) build the unsigned arm64 zip + .pkg and
# publish them — with electron-updater's latest-mac.yml metadata — to this
# repo's own Releases. The repo is public, so installed apps read the update
# metadata anonymously and any editor can download a release without an
# account or a token. The zip is what Squirrel.Mac swaps in on an in-app
# update; the .pkg is the installer humans run the first time. Manual runs
# (workflow_dispatch) build and upload the .pkg as a workflow artifact only,
# for testing the packaging step without cutting a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # macos-15 is the current arm64 image; macos-14 is deprecated and
    # AudioPro only targets Apple Silicon (see package.json build.mac.arch).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg/ffprobe/RNNoise model (arm64, SHA256-verified)
        run: npm run setup:bin

      # Signing and notarization only happen once the Apple Developer secrets
      # exist. Until then every step below is a no-op and the build produces
      # the same unsigned artifacts as before, so adding the configuration
      # costs nothing while the decision is pending.
      #
      # Required secrets (see docs/SIGNING.md):
      #   MACOS_CERTIFICATE          Developer ID Application .p12, base64
      #   MACOS_CERTIFICATE_PASSWORD password for that .p12
      #   APPLE_ID                   Apple ID that owns the Developer account
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
      #   APPLE_TEAM_ID              10-character team identifier
      - name: Check for signing credentials
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$APPLE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple Developer secrets configured — building unsigned."
          fi

      - name: Build macOS arm64 zip + pkg (publish to this repo's Releases on tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder reads the certificate and the notarization
          # credentials from these. They are unset below when the secrets do
          # not exist, which is what makes it skip signing.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A secret that does not exist arrives as an empty string, not as an
          # absent variable, and electron-builder reads an empty CSC_LINK as a
          # path to resolve rather than as "no certificate". Unset them so an
          # unsigned build looks to it like one that was never configured.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID \
                   APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Notarization is off in package.json and turned on here, so a local
          # `npm run build` never waits on Apple for a build nobody ships.
          args=()
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            args+=(--config.mac.notarize=true)
          fi
          # macOS ships bash 3.2, where expanding an empty array trips set -u.
          # The ${x[@]+...} guard expands to nothing instead of erroring.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            npm run build -- --publish always ${args[@]+"${args[@]}"}
          else
            npm run build -- --publish never ${args[@]+"${args[@]}"}
          fi

      # Proves the artifact is actually signed and notarized, rather than
      # assuming the build step did it. `spctl` is what Gatekeeper itself runs.
      - name: Verify signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          app="dist/mac-arm64/AudioPro.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Locate installer
        id: pkg
        run: |
          set -euo pipefail
          pkg_path="$(find dist -maxdepth 1 -name '*.pkg' -print -quit)"
          if [ -z "$pkg_path" ]; then
            echo "No .pkg found under dist/" >&2
            exit 1
          fi
          echo "path=$pkg_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$pkg_path")" >> "$GITHUB_OUTPUT"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
