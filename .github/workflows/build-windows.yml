name: Build Windows Installer

# Tag pushes (v0.3.0, v0.3.1, ...) build the NSIS x64 installer and
# publish it — with electron-updater's latest.yml metadata — to the same
# public audiopro-releases repo as the macOS job (which runs in parallel
# on the same tag; electron-builder appends assets to the shared release
# instead of clobbering it). Requires the RELEASES_TOKEN secret: a PAT
# with Contents read/write on audiopro-releases. Manual runs
# (workflow_dispatch) build and upload the installer as a workflow
# artifact only, for testing the packaging step without cutting a release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg/ffprobe/RNNoise model (x64, SHA256-verified)
        run: npm run setup:bin:win

      - name: Build Windows x64 installer (publish to audiopro-releases on tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            npm run build:win -- --publish always
          else
            npm run build:win -- --publish never
          fi

      - name: Locate installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          exe_path="$(find dist -maxdepth 1 -name '*.exe' -print -quit)"
          if [ -z "$exe_path" ]; then
            echo "No installer found under dist/" >&2
            exit 1
          fi
          echo "path=$exe_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$exe_path")" >> "$GITHUB_OUTPUT"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30
