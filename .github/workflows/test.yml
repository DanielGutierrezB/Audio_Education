name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # The suite (docs/PLAN.md Fase 9) generates its own synthetic WAV
      # fixtures via ffmpeg's lavfi sources and runs the pipeline against
      # them — the system package is enough, no bundled binaries needed.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
